name: kernel2
on:
  workflow_dispatch:
jobs:
  kernel:
    runs-on: macos-14
    timeout-minutes: 350
    steps:
      - name: select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app && xcodebuild -version
      - uses: actions/checkout@v4
      - name: clone UniXNU (wip/droidvm)
        run: git clone --depth 1 -b wip/droidvm https://github.com/Droid-VM/UniXNU ../UniXNU
      - name: brew openssl@3
        run: brew install openssl@3 || true
      - name: build setup..kernel (full log)
        run: |
          python3 scripts/build-droidvm-all.py --from setup --to kernel --unique-chip-id 0123456789abcdef
      - name: disk usage
        if: always()
        run: df -h / | tail -2
      - name: find artifacts
        if: always()
        run: |
          echo "--- out ---"; ls -R out 2>/dev/null | head -40
          echo "--- UniXNU out (顶两层) ---"; ls ../UniXNU/out 2>/dev/null
          find ../UniXNU/out -name '*.macho' -o -name 'kernel*' 2>/dev/null | head -20
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            out/droidvm/build-all/logs/**
            ../UniXNU/out/droidvm/logs/**
            ../UniXNU/out-reference/droidvm/logs/**
          retention-days: 7
          if-no-files-found: warn
      - name: upload kernels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernels
          path: |
            ../UniXNU/out/droidvm/**
            out/droidvm/release/**
          retention-days: 7
          if-no-files-found: warn
