name: ipados27d
on:
  workflow_dispatch:
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 350
    steps:
      - name: environment
        run: |
          sw_vers; sudo xcode-select -s /Applications/Xcode_27.1.app; xcodebuild -version; df -h / | tail -1
      - uses: actions/checkout@v4
      - name: clone UniXNU (wip/droidvm)
        run: git clone --depth 1 -b wip/droidvm https://github.com/Droid-VM/UniXNU ../UniXNU
      - name: brew deps
        run: |
          brew install llvm lld glslang shaderc spirv-tools openssl@3 gnu-sed bison flex cmake ninja pkg-config coreutils mtools dosfstools || true
          LLD=$(command -v lld-link || find /opt/homebrew -maxdepth 4 -name lld-link -type f 2>/dev/null | head -1)
          if [ -n "$LLD" ]; then mkdir -p /opt/homebrew/opt/llvm/bin && ln -sf "$LLD" /opt/homebrew/opt/llvm/bin/lld-link; fi
          command -v mformat
      - name: defconfig
        env:
          PATH: /opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          cd ../UniXNU
          ./unixnu defconfig droidvm_ipados27_defconfig -D "$GITHUB_WORKSPACE/ipados27"
      - name: fetch sources
        env:
          PATH: /opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: cd ../UniXNU && ./unixnu fetch
      - name: fetch IPSW
        env:
          PATH: /opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: cd ../UniXNU && ./unixnu ipsw fetch
      - name: tree and owner keys
        env:
          PATH: /opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          cd ../UniXNU
          ./unixnu tree
          T=$(ls -d out/droidvm/ipados-*/droidvm_ipados27/tree | head -1)
          OPENSSL=$(brew --prefix openssl@3)
          python3 "$T/kits/VerifiedRoot/tests/check.py" --output "$T/build/verified-root-host" --openssl-prefix "$OPENSSL" 2>&1 | tail -5
          ls "$T/build/verified-root-host/keys" | head -3
      - name: build kernel first pass (assembles tree, policies missing)
        env:
          PATH: /opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          cd ../UniXNU
          ./unixnu build kernel || echo "first pass non-zero (expected: root policies not built yet)"
      - name: root policies
        env:
          PATH: /opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          cd ../UniXNU
          T=$(ls -d out/droidvm/ipados-*/droidvm_ipados27/tree | head -1)
          D=$(ls -d out/ipsw/24A446 | head -1)
          ls -lS "$D"/*.dmg* 2>/dev/null | head -6
          OS=$(ls -S "$D"/*.dmg.aea 2>/dev/null | head -1)
          SYS=$(ls -S "$D"/*.dmg.aea 2>/dev/null | sed -n 2p)
          if [ -z "$OS" ]; then OS=$(ls -S "$D"/*.dmg 2>/dev/null | head -1); SYS=$(ls -S "$D"/*.dmg 2>/dev/null | sed -n 2p); fi
          echo "OS=$OS"; echo "SYS=$SYS"
          python3 "$T/scripts/build-droidvm-root-policies.py" --tree "$T" \
            --profile profiles/os/ipados-27.0.1-24A446/profile.toml --os "$OS" --systemos "$SYS" 2>&1 | tail -20
          ls -l "$T/build/droidvm-root-images" 2>/dev/null | head -5
      - name: build kernel second pass (bundles the root policies)
        env:
          PATH: /opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: cd ../UniXNU && ./unixnu build kernel
      - name: build package
        env:
          PATH: /opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: cd ../UniXNU && ./unixnu build package
      - name: build payload
        env:
          PATH: /opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: cd ../UniXNU && ./unixnu build payload
      - name: collect
        if: always()
        run: |
          mkdir -p artifacts/logs artifacts/small artifacts/images
          find ../UniXNU/out -name '*.log' -size -20M 2>/dev/null | head -60 | while read f; do cp "$f" "artifacts/logs/$(echo $f | tr '/' '_')" 2>/dev/null; done
          T=$(ls -d ../UniXNU/out/droidvm/ipados-*/droidvm_ipados27/tree 2>/dev/null | head -1)
          find "$T" -maxdepth 3 -type f \( -name '*.macho' -o -name '*.img' -o -name '*.efi' \) 2>/dev/null | head -12 | while read f; do cp "$f" "artifacts/small/$(echo $f | tr '/' '_')" 2>/dev/null; done
          cp -v "$T"/build/droidvm-root-images/*.img artifacts/images/ 2>/dev/null || true
          ls -lh artifacts/small artifacts/images 2>/dev/null | head -20
          du -sh artifacts/small artifacts/images artifacts/logs
      - name: upload small
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ip27-small
          path: |
            artifacts/small/**
            artifacts/logs/**
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
      - name: upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ip27-images
          path: artifacts/images/**
          retention-days: 2
          compression-level: 0
          if-no-files-found: warn
