name: xcodeprobe
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - name: which OS and Xcodes
        run: |
          echo "== sw_vers"; sw_vers
          echo "== Xcodes"; ls -d /Applications/Xcode*.app 2>/dev/null || echo none
          echo "== default"; xcodebuild -version || true
          echo "== iig"; (xcrun --find iig || echo none)
