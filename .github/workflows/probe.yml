name: probe
on:
  workflow_dispatch:
jobs:
  env:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: environment
        run: |
          sw_vers
          uname -m
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version || true
          (xcrun --find iig || echo "no iig")
          python3 -V
          git --version
          df -h / | tail -1
      - uses: actions/checkout@v4
      - name: clone siblings
        run: |
          git clone --depth 1 -b wip/droidvm https://github.com/Droid-VM/UniXNU ../UniXNU
          ls ../UniXNU | head -20
          echo "--- tools ---"
          ls ../UniXNU/tools 2>/dev/null | head -20
      - name: unixnu introspect
        run: |
          cd ../UniXNU
          file unixnu || true
          head -40 unixnu || true
          (./unixnu --help 2>&1 | head -40) || true
      - name: defconfig try
        run: |
          cd ../UniXNU
          (./unixnu defconfig droidvm_defconfig -D "$GITHUB_WORKSPACE" 2>&1 | tail -30) || true
